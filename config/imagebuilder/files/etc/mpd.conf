music_directory		"/media/music"
playlist_directory	"/media/.mpd/playlists"
db_file			"/media/.mpd/database"
state_file		"/media/.mpd/state"
sticker_file		"/media/.mpd/sticker.sql"

input {
        plugin "curl"
}

# 蓝牙音响：MPD 通过 PulseAudio 输出，PulseAudio 的 module-bluez5-discover
# 自动把已配对的 A2DP 音箱作为 sink，切到该 sink 后声音即走蓝牙
audio_output {
	type		"pulse"
	name		"Bluetooth"
	server		"/var/run/pulse/native"
}

# 3.5mm AV 输出（与 av-mixer 的 TDM_B 路由配合，默认不启用）
audio_output {
	type		"alsa"
	name		"AV Analog"
	device		"hw:0,0"
	mixer_type	"software"
	enabled		"no"
}
