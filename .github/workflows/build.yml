name: Build CM311-1a ImmortalWrt 25.12.2

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "内核系列（image job 使用，如 6.6.y）"
        required: false
        default: "6.6.y"
      build_kernel:
        description: "是否自编译内核（默认 false，直接使用 ophub/kernel 预编译包）"
        required: false
        default: "false"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TZ: Etc/UTC
  IMMORTALWRT_VERSION: "25.12.2"
  BOARD: "s905l3a-cm311"

jobs:
  # 可选：自编译内核。仓库内 kernel-config/config-6.6 与 ophub stable 模板一致，
  # 默认关闭，直接使用 ophub/kernel 的 kernel_stable 预编译包（已含 btusb.ko）。
  kernel:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_kernel == 'true' }}
    runs-on: ubuntu-26.04-arm
    env:
      KERNEL_SERIES: ${{ inputs.kernel_version || '6.6.y' }}
      KERNEL_SIGN: "-cm311bt"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验内核配置（仓库内置 config-6.6）
        run: |
          CONFIG_FILE="kernel-config/config-${KERNEL_SERIES%.y}"
          echo "config: ${CONFIG_FILE}"
          test -s "${CONFIG_FILE}" \
            || { echo "::error::缺少 ${CONFIG_FILE}"; exit 1; }
          grep -q 'CONFIG_BT_HCIBTUSB=m' "${CONFIG_FILE}" \
            || { echo "::error::内核配置缺少 CONFIG_BT_HCIBTUSB=m"; exit 1; }

      - name: 编译内核 [ ${{ env.KERNEL_SERIES }} ]
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: kernel
          kernel_source: unifreq
          kernel_version: ${{ env.KERNEL_SERIES }}
          kernel_sign: ${{ env.KERNEL_SIGN }}
          kernel_config: kernel-config
          kernel_package: all

      # 新版编译动作只产出一个合并包 <ver><sign>.tar.gz，内部是
      # <ver><sign>/{boot,dtb-*,modules}-*.tar.gz，因此要拆开检查 btusb.ko。
      - name: 门禁：btusb.ko 必须存在
        run: |
          outer="$(find "${PACKAGED_OUTPUTPATH}" -maxdepth 1 -name '*.tar.gz' | head -n 1)"
          echo "outer: ${outer}"
          test -s "${outer}" || { echo "::error::内核目录下没有 tar.gz 产物"; exit 1; }
          listing="$(tar -tzf "${outer}")"
          echo "${listing}" | head -n 20

          work="$(mktemp -d)"
          if echo "${listing}" | grep -q 'drivers/bluetooth/btusb.ko'; then
            echo "btusb.ko 直接位于合并包内"
            exit 0
          fi

          mods_name="$(echo "${listing}" | grep -E '(^|/)modules-[^/]*\.tar\.gz$' | head -n 1)"
          echo "modules: ${mods_name}"
          test -n "${mods_name}" || { echo "::error::合并包内未找到 modules 内核包"; exit 1; }
          tar -xzf "${outer}" -C "${work}" "${mods_name}"
          tar -tzf "${work}/${mods_name}" | grep -q 'drivers/bluetooth/btusb.ko' \
            || { echo "::error::内核未编入 btusb.ko，蓝牙无法工作"; exit 1; }

      - name: 规范化内核包名（打包阶段按 <version>.tar.gz 下载）
        run: |
          cd "${PACKAGED_OUTPUTPATH}"
          ver="$(echo "${PACKAGED_OUTPUTTAGS}" | awk '{print $1}')"
          echo "version: ${ver}"
          if [[ ! -f "${ver}.tar.gz" ]]; then
            src="$(ls -1 *.tar.gz | grep -v '^deb-' | grep "${ver}" | head -n 1)"
            echo "repack: ${src} -> ${ver}.tar.gz"
            rm -rf /tmp/kx && mkdir -p /tmp/kx
            tar -mxzf "${src}" -C /tmp/kx
            inner="$(ls /tmp/kx | head -n 1)"
            if [[ "${inner}" != "${ver}" ]]; then
              mv "/tmp/kx/${inner}" "/tmp/kx/${ver}"
            fi
            tar -czf "${ver}.tar.gz" -C /tmp/kx "${ver}"
            rm -rf /tmp/kx
          fi
          ls -lh *.tar.gz

      - name: 发布内核到 Release
        if: env.PACKAGED_STATUS == 'success'
        uses: ophub/upload-to-releases@main
        with:
          tag: kernel_stable
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*.tar.gz
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}

  # 1. ImmortalWrt 25.12.2 armsr/armv8 rootfs（LuCI + bluez + 蓝牙固件）
  rootfs:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验蓝牙固件（仓库内置）
        run: |
          ls -l config/imagebuilder/files/lib/firmware/rtl_bt/
          test -s config/imagebuilder/files/lib/firmware/rtl_bt/rtl8761bu_fw.bin \
            || { echo "::error::缺少 rtl8761bu_fw.bin"; exit 1; }

      - name: 构建 rootfs [ immortalwrt:${{ env.IMMORTALWRT_VERSION }} ]
        run: |
          chmod +x config/imagebuilder/imagebuilder.sh
          ./config/imagebuilder/imagebuilder.sh "immortalwrt:${IMMORTALWRT_VERSION}"

      - name: 门禁：固件与 bluez 必须存在
        run: |
          rootfs="$(ls output/*rootfs.tar.gz | head -n 1)"
          echo "rootfs: ${rootfs}"
          tar -tzf "${rootfs}" | grep -q 'lib/firmware/rtl_bt/rtl8761bu_fw.bin' \
            || { echo "::error::缺少 rtl8761bu_fw.bin"; exit 1; }
          tar -tzf "${rootfs}" | grep -q 'lib/firmware/rtl_bt/rtl8761bu_config.bin' \
            || { echo "::error::缺少 rtl8761bu_config.bin"; exit 1; }
          tar -tzf "${rootfs}" | grep -Eq '(sbin|bin)/bluetoothctl' \
            || { echo "::error::缺少 bluetoothctl"; exit 1; }
          tar -tzf "${rootfs}" | grep -q 'etc/uci-defaults/99-bluetooth' \
            || { echo "::error::缺少蓝牙开机启用脚本"; exit 1; }

      - name: 上传 rootfs
        uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: output/*rootfs.tar.gz
          retention-days: 7

  # 2. 组合内核 + rootfs，打包 CM311-1a 可刷镜像
  image:
    needs: [rootfs]
    runs-on: ubuntu-26.04
    env:
      KERNEL_SERIES: ${{ inputs.kernel_version || '6.6.y' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载 rootfs
        uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: artifacts/rootfs

      - name: 打包镜像 [ ${{ env.BOARD }} ]
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: artifacts/rootfs/*rootfs.tar.gz
          openwrt_board: ${{ env.BOARD }}
          openwrt_kernel: ${{ env.KERNEL_SERIES }}
          auto_kernel: true
          kernel_repo: ophub/kernel
          kernel_usage: stable
          builder_name: steven-ye

      - name: 门禁：镜像产物存在
        run: |
          ls -lh ${PACKAGED_OUTPUTPATH}
          test -n "$(ls ${PACKAGED_OUTPUTPATH}/*.img.gz)"

      - name: 上传镜像到 Release
        if: env.PACKAGED_STATUS == 'success'
        uses: ophub/upload-to-releases@main
        with:
          tag: firmware_${{ env.IMMORTALWRT_VERSION }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### CM311-1a ImmortalWrt ${{ env.IMMORTALWRT_VERSION }}
            - 默认 IP: `192.168.1.1`，默认账号 `root`
            - 蓝牙: RTL8761B（btusb + rtl8761bu 固件，bluez 开机自启）
            - 内核: ophub/kernel `kernel_stable` 预编译包（config 与仓库 kernel-config 一致）
            - 刷机: 先写 U 盘启动验证，再在「系统 → 晶晨宝盒」安装到 eMMC，设备选 `CM311-1a-YST`
